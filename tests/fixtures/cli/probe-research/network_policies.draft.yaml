version: 1
filesystem_policy:
    read_only: [/usr, /lib, /etc]
    read_write: [/sandbox, /tmp]
landlock:
    compatibility: best_effort
process:
    run_as_user: sandbox
    run_as_group: sandbox
network_policies:
    outbound:
        - host: api.stripe.com
          port: 443
          protocol: tcp
        - host: api.perplexity.ai
          port: 443
          protocol: tcp
